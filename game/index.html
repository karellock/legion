<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Legion Prototype</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="hud">
      <div class="hudHeader">
        <h1>Legion Game Prototype</h1>
        <button id="hudToggleBtn" type="button" aria-label="Collapse sidebar" aria-expanded="true" title="Collapse sidebar">Hide</button>
      </div>
      <p>Press V to toggle vision ranges.</p>
      <div id="balanceConfig">Balance: D+1 H+5 S+1 | Grace S20s B45s | Spawn Y 50-550 (pad 0, slots 7)</div>
      <div id="matchControls">
        <button id="restartMatchBtn" type="button">Restart Match</button>
      </div>
      <button id="downloadLogsBtn" type="button">Download Logs</button>
      <section id="matchResultPanel" hidden>
        <h2 id="matchResultTitle">Match Paused</h2>
        <div id="matchResultSummary">A base was destroyed.</div>
        <div id="matchResultStats"></div>
        <div class="matchResultActions">
          <button id="continueAfterEndBtn" type="button">Continue</button>
          <button id="restartAfterEndBtn" type="button">Restart</button>
        </div>
      </section>
      <div id="devToolsHud">
        <label class="devToolRow" for="timeScaleRange">
          <span>Time Scale</span>
          <input id="timeScaleRange" type="range" min="0" max="4" step="0.25" value="1" />
          <strong id="timeScaleValue">1.00x</strong>
        </label>
        <label class="devToolRow" for="leftBotStrategy">
          <span>Blue Bot</span>
          <select id="leftBotStrategy">
            <option value="none">None</option>
            <option value="damage-only">Damage Only</option>
            <option value="health-only">Health Only</option>
            <option value="spawn-only">Spawn Only</option>
            <option value="balanced">Balanced</option>
          </select>
        </label>
        <label class="devToolRow" for="rightBotStrategy">
          <span>Red Bot</span>
          <select id="rightBotStrategy">
            <option value="none">None</option>
            <option value="damage-only">Damage Only</option>
            <option value="health-only">Health Only</option>
            <option value="spawn-only">Spawn Only</option>
            <option value="balanced">Balanced</option>
          </select>
        </label>
        <label class="devToolRow" for="spawnPaddingRange">
          <span>Spawn Space</span>
          <input id="spawnPaddingRange" type="range" min="0" max="250" step="1" value="250" />
          <strong id="spawnPaddingValue">250</strong>
        </label>
        <label class="devToolRow" for="spawnSlotCountRange">
          <span>Spawn Slots</span>
          <input id="spawnSlotCountRange" type="range" min="2" max="15" step="1" value="7" />
          <strong id="spawnSlotCountValue">7</strong>
        </label>
        <label class="devToolRow" for="towerDamagePerMinuteRange">
          <span>Tower Dmg/min</span>
          <input id="towerDamagePerMinuteRange" type="range" min="0" max="6" step="0.1" value="1.2" />
          <strong id="towerDamagePerMinuteValue">1.2</strong>
        </label>
        <label class="devToolRow" for="baseDamagePerMinuteRange">
          <span>Base Dmg/min</span>
          <input id="baseDamagePerMinuteRange" type="range" min="0" max="4" step="0.1" value="0.6" />
          <strong id="baseDamagePerMinuteValue">0.6</strong>
        </label>
        <label class="devToolRow" for="upgradeBaseCostRange">
          <span>Upgrade Gold</span>
          <input id="upgradeBaseCostRange" type="range" min="0" max="100" step="1" value="20" />
          <strong id="upgradeBaseCostValue">20</strong>
        </label>
        <label class="devToolRow" for="killBountyGoldRange">
          <span>Kill Gold</span>
          <input id="killBountyGoldRange" type="range" min="0" max="50" step="1" value="10" />
          <strong id="killBountyGoldValue">10</strong>
        </label>
        <label class="devToolRow" for="shrineGoldPerSecondRange">
          <span>Shrine Gold/s</span>
          <input id="shrineGoldPerSecondRange" type="range" min="0" max="20" step="1" value="2" />
          <strong id="shrineGoldPerSecondValue">2</strong>
        </label>
      </div>
      <div id="upgradeHud">
        <div class="upgradeColumn" id="leftUpgradeColumn">
          <h2>Blue Upgrades</h2>
          <div class="upgradeSummary" id="leftUpgradeSummary">Gold 0 | D0 H0 S0</div>
          <button id="leftUpgradeDamageBtn" type="button">Damage +1</button>
          <button id="leftUpgradeHealthBtn" type="button">Health +5</button>
          <button id="leftUpgradeSpawnBtn" type="button">Spawn +1</button>
        </div>
        <div class="upgradeColumn" id="rightUpgradeColumn">
          <h2>Red Upgrades</h2>
          <div class="upgradeSummary" id="rightUpgradeSummary">Gold 0 | D0 H0 S0</div>
          <button id="rightUpgradeDamageBtn" type="button">Damage +1</button>
          <button id="rightUpgradeHealthBtn" type="button">Health +5</button>
          <button id="rightUpgradeSpawnBtn" type="button">Spawn +1</button>
        </div>
      </div>
      <div id="selectionHud">
        <h2>Selection</h2>
        <div id="selectionInfo">Click a unit or structure to inspect stats.</div>
      </div>
    </div>
    <div id="tableWrap">
      <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>
  </div>
  <script src="js/simulation.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
