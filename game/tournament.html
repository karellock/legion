<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Legion Tournament Lab</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="tournamentPage">
    <header class="tournamentHeader">
      <h1>Legion Tournament Lab</h1>
      <button id="backToGameBtn" type="button">Back To Game</button>
    </header>

    <section class="tournamentCard">
      <h2>Map</h2>
      <div class="tournamentGrid">
        <label>
          <span>Profile</span>
          <select id="mapProfileSelect">
            <option value="classic">Classic</option>
            <option value="snowball-line" selected>Snowball Line (No Towers, Base 1 HP)</option>
          </select>
        </label>
        <label>
          <span>Map Length</span>
          <input id="mapLengthInput" type="number" min="600" max="6000" step="50" value="2200" />
        </label>
        <label>
          <span>Lane Inset</span>
          <input id="laneInsetInput" type="number" min="10" max="300" step="5" value="40" />
        </label>
        <label>
          <span>Base HP</span>
          <input id="baseHpInput" type="number" min="1" max="5000" step="1" value="1" />
        </label>
        <label class="inlineToggle">
          <span>Towers Enabled</span>
          <input id="enableTowersInput" type="checkbox" />
        </label>
      </div>
    </section>

    <section class="tournamentCard">
      <h2>Tournament</h2>
      <div class="tournamentGrid">
        <label>
          <span>Matches Per Side</span>
          <input id="matchesPerSideInput" type="number" min="1" max="50" step="1" value="5" />
        </label>
        <label>
          <span>Max Minutes/Match</span>
          <input id="maxMinutesInput" type="number" min="1" max="30" step="1" value="6" />
        </label>
      </div>
      <div>
        <div class="sectionLabel">Strategies (round-robin each vs each)</div>
        <div id="strategyList" class="strategyList"></div>
      </div>
      <div class="tournamentActions">
        <button id="runTournamentBtn" type="button">Run Round Robin</button>
        <button id="resetMapProfileBtn" type="button">Reset Profile Defaults</button>
      </div>
      <div id="tournamentStatus" class="tournamentStatus">Ready.</div>
    </section>

    <section class="tournamentCard">
      <h2>Leaderboard</h2>
      <div id="leaderboardTableWrap"></div>
    </section>

    <section class="tournamentCard">
      <h2>Pair Results</h2>
      <div id="pairResultsWrap"></div>
    </section>
  </div>

  <script src="js/simulation.js"></script>
  <script src="js/tournament.js"></script>
</body>
</html>
