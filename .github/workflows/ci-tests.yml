name: Legion CI Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  simulation-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run simulation tests
        run: node game/tests/simulation.node.test.js
